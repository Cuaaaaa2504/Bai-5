name: Check mobile app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm test
      - run: npm run check
      - run: npx expo-doctor@latest
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-package-files
          path: |
            package.json
            package-lock.json
